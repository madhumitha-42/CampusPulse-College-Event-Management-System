services:
  # ---------------------------------------------------------------------------
  # Django REST API Backend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: campuspulse-backend
    runtime: python
    region: oregon
    buildCommand: bash backend/build.sh
    startCommand: cd backend && gunicorn config.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: campuspulse-db
          property: connectionString

  # ---------------------------------------------------------------------------
  # React Frontend Static Site
  # ---------------------------------------------------------------------------
  - type: web
    name: campuspulse-frontend
    runtime: static
    buildCommand: pnpm install && pnpm --filter @workspace/college-events run build
    staticPublishPath: frontend/dist/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: campuspulse-backend
          property: host

databases:
  # ---------------------------------------------------------------------------
  # Production PostgreSQL Database
  # ---------------------------------------------------------------------------
  - name: campuspulse-db
    databaseName: campuspulse
    user: campuspulse_user
    plan: free
